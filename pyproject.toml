[project]
name = "inkling-chaos"
version = "1.0.0"
description = "The numbers say chaotic. The database says regular. Inkling 2 Small believes the database. $29 of RL on Tinker fixes the worst of it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]

[project.optional-dependencies]
eval = ["openai>=1.40", "anthropic>=0.40"]
train = ["tinker", "tinker-cookbook", "chz"]
orbit = ["numba>=0.60"]

[tool.uv]
package = false
